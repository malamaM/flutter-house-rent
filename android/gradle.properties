org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Some current Flutter plugins still publish Java 8 bytecode settings. JDK 21
# reports that source/target compatibility notice even though the build is
# valid; suppress that compiler-only warning until those plugins migrate.
android.javaCompile.suppressSourceTargetDeprecationWarning=true
# Flutter's current Gradle plugin still uses the legacy Android DSL while
# Flutter completes its AGP 9 migration. Remove when that plugin supports the
# default AGP 9 DSL.
android.newDsl=false
# AGP 9 provides Kotlin for the application; keep the legacy opt-out disabled
# so plugins can use the built-in Kotlin integration.
android.builtInKotlin=true
